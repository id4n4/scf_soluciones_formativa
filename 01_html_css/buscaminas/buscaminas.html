<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
  <link rel="stylesheet" href="style.css">
  <title>BuscaMinas</title>
  <script src="script.js" defer></script>
</head>
<body>
    <header>
      <h1>BuscaMinas</h1>
    </header>
    <main>
      <section>
        <h3>Reglas del juego</h3>
        <p>El objetivo del juego es descubrir todas las minas sin detonar ninguna.</p>
      </section>
      <section>
        <h3>Tablero de juego</h3>
        <p>El tablero de juego consiste en una cuadrícula de celdas, algunas de las cuales contienen minas.</p>
      </section>
      <section id="game">
        <div id="buttons_size_game">
          <button class="selected" value="5">x5</button>
          <button value="8">x8</button>
          <button value="10">x10</button>
        </div>
        <div id="board"></div>

      </section>

    </main>
</body>
</html>
