    <h1>9. DOM: crear y quitar elementos · solución</h1>

<div class="zona">
    <div id="contenedor"></div>
    <p id="quitame">Este párrafo hay que quitarlo con JavaScript</p>
</div>

    <h3>Salida</h3>
    <pre id="salida"></pre>

    <script src="../comun.js"></script>
    <script>
        // EJERCICIO 9 · DOM: crear y quitar elementos  (SOLUCIÓN)
        //
        // RESULTADO ESPERADO
        //  En la página: 3 tarjetas (Manzana, Pera, Plátano) y el párrafo ya no está.
        //  Tarjetas creadas: 3

        const contenedor = document.getElementById("contenedor");
        const frutas = ["Manzana", "Pera", "Plátano"];

        frutas.forEach((fruta) => {
            const tarjeta = document.createElement("div");   // 1) crear
            tarjeta.classList.add("tarjeta");                // 2) rellenar
            tarjeta.textContent = fruta;
            contenedor.appendChild(tarjeta);                 // 3) meter en la página
        });

        document.getElementById("quitame").remove();

        mostrar("Tarjetas creadas:", document.querySelectorAll(".tarjeta").length);
    </script>
</body>
