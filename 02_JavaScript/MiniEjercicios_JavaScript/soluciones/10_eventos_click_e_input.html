    <script>
        // EJERCICIO 10 · Eventos: click e input  (SOLUCIÓN)

        // RESULTADO ESPERADO
        //  Al pulsar 3 veces el botón: Clics: 3
        //  Al escribir Ana: Hola, Ana

        const boton = document.getElementById("btn-contar");
        const clics = document.getElementById("clics");
        const caja  = document.getElementById("nombre");
        const eco   = document.getElementById("eco");

        let contador = 0;

        boton.addEventListener("click", () => {
            contador++;
            clics.textContent = contador;
            mostrar("Clic número", contador);
        });

        caja.addEventListener("input", () => {
            eco.textContent = "Hola, " + caja.value;
        });
