    <script>
        // EJERCICIO 3 · Operadores y plantillas de texto  (SOLUCIÓN)
        //
        // RESULTADO ESPERADO
        //  5 == "5" → true
        //  5 === "5" → false
        //  ¿Entra Ana? true
        //  ¿Entra Luis? false
        //  Hola, Ana. Tienes 20 años.

        mostrar('5 == "5" →', 5 == "5");     // true: == convierte el tipo
        mostrar('5 === "5" →', 5 === "5");   // false: === compara valor Y tipo (usa siempre este)

        function puedeEntrar(tieneEntrada, edad) {
            return tieneEntrada && edad >= 18;
        }

        mostrar("¿Entra Ana?", puedeEntrar(true, 20));
        mostrar("¿Entra Luis?", puedeEntrar(true, 16));

        const nombre = "Ana";
        const edad = 20;
        const saludo = `Hola, ${nombre}. Tienes ${edad} años.`;
        mostrar(saludo);
    </script>
