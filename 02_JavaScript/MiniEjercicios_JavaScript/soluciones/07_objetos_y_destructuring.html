    <script>
        // EJERCICIO 7 · Objetos y destructuring  (SOLUCIÓN)
        //
        // RESULTADO ESPERADO
        //  Nombre: Taza
        //  Precio: 12
        //  Stock nuevo: 5
        //  Taza cuesta 12 €
        //  Nombres: ["Taza","Plato","Vaso"]

        const producto = { nombre: "Taza", precio: 12, stock: 20 };

        mostrar("Nombre:", producto.nombre);       // con punto
        mostrar("Precio:", producto["precio"]);    // con corchetes

        producto.stock = 5;                        // cambiar una propiedad
        mostrar("Stock nuevo:", producto.stock);

        const { nombre, precio } = producto;       // destructuring
        mostrar(`${nombre} cuesta ${precio} €`);

        const productos = [
            { nombre: "Taza",  precio: 12 },
            { nombre: "Plato", precio: 8 },
            { nombre: "Vaso",  precio: 4 },
        ];
        const nombres = productos.map(p => p.nombre);
        mostrar("Nombres:", nombres);
    </script>
