    <script>
        // EJERCICIO 5 · Ámbito (scope)  (SOLUCIÓN)
        //
        // RESULTADO ESPERADO
        //  Dentro de la función veo el total: 3
        //  Mensaje: Hay alumnos

        const total = 3;          // global: se ve en todo el script

        function revisar() {
            mostrar("Dentro de la función veo el total:", total);

            let mensaje = "";               // declarada en la función: se ve en toda la función
            if (total > 0) {
                mensaje = "Hay alumnos";    // aquí solo le damos valor
            }

            mostrar("Mensaje:", mensaje);
        }

        revisar();
    </script>
