    <h3>Salida</h3>
    <pre id="salida"></pre>

    <script src="../comun.js"></script>
    <script>
        // EJERCICIO 4 · Funciones tradicionales y funciones flecha  (SOLUCIÓN)
        //
        // RESULTADO ESPERADO
        //  suma(2, 3) = 5
        //  doble(4) = 8
        //  Hola, Marta
        //  Hola, invitado

        // Función tradicional
        function resta(a, b) {
            return a - b;
        }

        // Función flecha: con una sola línea no hace falta return
        const suma = (a, b) => a + b;

        // Con un solo parámetro no hacen falta paréntesis
        const doble = n => n * 2;

        // Parámetro por defecto: si no se pasa nombre, vale "invitado"
        const saludar = (nombre = "invitado") => `Hola, ${nombre}`;

        mostrar("suma(2, 3) =", suma(2, 3));
        mostrar("doble(4) =", doble(4));
        mostrar(saludar("Marta"));
        mostrar(saludar());
    </script>
