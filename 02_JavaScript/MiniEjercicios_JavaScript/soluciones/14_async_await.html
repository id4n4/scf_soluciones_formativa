    <h3>Salida</h3>
    <pre id="salida"></pre>

    <script src="../comun.js"></script>
    <script>
        // EJERCICIO 14 · async / await  (SOLUCIÓN)
        //
        // RESULTADO ESPERADO
        //  3
        //  2
        //  1
        //  ¡Despegue!
        //  10 / 2 = 5
        //  Error: No se puede dividir entre 0

        const esperar = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        function dividir(a, b) {
            return new Promise((resolve, reject) => {
                if (b === 0) reject(new Error("No se puede dividir entre 0"));
                else resolve(a / b);
            });
        }

        async function contarAtras() {
            for (let i = 3; i >= 1; i--) {
                mostrar(i);
                await esperar(1000);     // pausa ESTA función un segundo, sin bloquear la página
            }
            mostrar("¡Despegue!");
        }

        async function probarDivision() {
            try {
                const r = await dividir(10, 2);   // await espera el resultado de la promesa
                mostrar("10 / 2 =", r);
                await dividir(5, 0);              // esta promesa se rechaza → salta al catch
                mostrar("Esto no se llega a mostrar");
            } catch (error) {
                mostrar("Error: " + error.message);
            }
        }

        async function empezar() {
            await contarAtras();
            await probarDivision();
        }

        empezar();
    </script>
</body>
