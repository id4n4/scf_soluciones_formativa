    <h1>10. Eventos: click e input</h1>

    <div class="zona">
        <button id="btn-contar">Púlsame</button>
        <p>Clics: <strong id="clics">0</strong></p>
        <input id="nombre" placeholder="Escribe tu nombre">
        <p id="eco">Hola, ...</p>
    </div>

    <h3>Salida</h3>
    <pre id="salida"></pre>

    <script src="../comun.js"></script>
    <script>
        // EJERCICIO 10 · Eventos: click e input
        //
        // QUÉ TIENES QUE HACER
        //  1. Cada vez que se pulse el botón, suma 1 al contador y muéstralo en #clics.
        //  2. Mientras se escribe en la caja (evento input), escribe en #eco "Hola, " + lo escrito.
        //
        // RESULTADO ESPERADO
        //  Al pulsar 3 veces el botón: Clics: 3
        //  Al escribir Ana: Hola, Ana

        const boton = document.getElementById("btn-contar");
        const clics = document.getElementById("clics");
        const caja = document.getElementById("nombre");
        const eco = document.getElementById("eco");

        let contador = 0;

        // TODO 1: boton.addEventListener("click", () => { ... });
        boton.addEventListener('click', () => {
            clics.textContent = ++contador
        })


        // TODO 2: caja.addEventListener("input", () => { ... });
        //         (lo escrito está en caja.value)
        caja.addEventListener('input', () => {

        })
    </script>
</body>
