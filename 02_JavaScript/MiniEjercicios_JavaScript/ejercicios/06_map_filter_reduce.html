    <h1>6. map, filter y reduce</h1>


    <h3>Salida</h3>
    <pre id="salida"></pre>

    <script src="../comun.js"></script>
    <script>
        // EJERCICIO 6 · map, filter y reduce
        //
        // QUÉ TIENES QUE HACER
        //  1. Con map, crea conIVA: cada precio multiplicado por 1.21.
        //  2. Con filter, crea caros: los precios mayores que 15.
        //  3. Con reduce, calcula total: la suma de todos los precios.
        //
        // RESULTADO ESPERADO
        //  Precios: [10,25,8,40]
        //  Con IVA: [12.1,30.25,9.68,48.4]
        //  Caros: [25,40]
        //  Total: 83
        //  El array original no cambia: [10,25,8,40]

        const precios = [10, 25, 8, 40];

        // TODO 1: map
        const conIVA = precios.map(v => v * 1.21);

        // TODO 2: filter
        const caros = precios.filter(v => v > 15);

        // TODO 3: reduce (pista: (acc, p) => acc + p, empezando en 0)
        const total = precios.reduce((acc, p) => acc + p, 0);

        mostrar("Precios:", precios);
        mostrar("Con IVA:", conIVA);
        mostrar("Caros:", caros);
        mostrar("Total:", total);
        mostrar("El array original no cambia:", precios);
    </script>
