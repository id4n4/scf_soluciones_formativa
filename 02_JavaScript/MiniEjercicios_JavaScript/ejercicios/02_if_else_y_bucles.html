    <h3>Salida</h3>

    <script src="../comun.js"></script>
    <script>
        // EJERCICIO 2 · if / else y bucles
        //
        // QUÉ TIENES QUE HACER
        //  1. Completa el if para que muestre "Aprobado" si la nota es 5 o más, y "Suspenso" si no.
        //  2. Haz un for que muestre los números del 1 al 5.
        //
        // RESULTADO ESPERADO
        //  Nota 7: Aprobado
        //  Nota 3: Suspenso
        //  1
        //  2
        //  3
        //  4
        //  5

        function evaluar(nota) {
            // TODO 1: if / else
            //   si nota >= 5 → mostrar("Nota " + nota + ": Aprobado")
            //   si no        → mostrar("Nota " + nota + ": Suspenso")
            if (nota >= 5)
                mostrar(`Nota ${nota}: aprobado`)
            else
                mostrar(`Nota ${nota}: Suspenso`)

        }

        evaluar(7);
        evaluar(3);

        // TODO 2: for del 1 al 5 (pista: let i = 1; i <= 5; i++)
        for (let i = 1; i <= 5; i++) {
            mostrar(i)
        }
    </script>
