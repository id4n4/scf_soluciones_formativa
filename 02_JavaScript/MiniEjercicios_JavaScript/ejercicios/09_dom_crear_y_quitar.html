    <h1>9. DOM: crear y quitar elementos</h1>

    <div class="zona">
        <div id="contenedor"></div>
        <p id="quitame">Este párrafo hay que quitarlo con JavaScript</p>
    </div>

    <h3>Salida</h3>
    <pre id="salida"></pre>

    <script src="../comun.js"></script>
    <script>
        // EJERCICIO 9 · DOM: crear y quitar elementos
        //
        // QUÉ TIENES QUE HACER
        //  1. Recorre el array frutas y por cada una crea un div con la clase "tarjeta" y su nombre. Mételo en #contenedor.
        //  2. Quita de la página el párrafo #quitame con remove().
        //
        // RESULTADO ESPERADO
        //  En la página: 3 tarjetas (Manzana, Pera, Plátano) y el párrafo ya no está.
        //  Tarjetas creadas: 3

        const contenedor = document.getElementById("contenedor");
        const frutas = ["Manzana", "Pera", "Plátano"];

        frutas.forEach((fruta) => {
            // TODO 1:
            const tarjeta = document.createElement("div");
            tarjeta.classList.add('tarjeta')
            tarjeta.textContent = fruta
            contenedor.appendChild(tarjeta);
        });

        // TODO 2: quita el párrafo #quitame
        const quitame = document.getElementById('quitame')
        quitame.remove()


        mostrar("Tarjetas creadas:", document.querySelectorAll(".tarjeta").length);
    </script>
</body>
