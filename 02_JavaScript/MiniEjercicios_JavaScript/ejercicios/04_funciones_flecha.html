    <script>
        // EJERCICIO 4 · Funciones tradicionales y funciones flecha
        //
        // QUÉ TIENES QUE HACER
        //  1. Escribe suma como función flecha: const suma = (a, b) => ... (hasta que lo hagas, la consola dará el error "suma is not a function").
        //  2. Escribe doble como función flecha de un solo parámetro (sin paréntesis).
        //  3. Dale a saludar un parámetro por defecto "invitado".
        //
        // RESULTADO ESPERADO
        //  suma(2, 3) = 5
        //  doble(4) = 8
        //  Hola, Marta
        //  Hola, invitado

        // Función tradicional (ya hecha, como ejemplo)
        function resta(a, b) {
            return a - b;
        }

        // TODO 1: suma como función flecha
        const suma = (a, b) => a + b;

        // TODO 2: doble como función flecha de un parámetro
        const doble = (a) => a * 2;

        // TODO 3: parámetro por defecto
        const saludar = (nombre = 'invitado') => `Hola, ${nombre}`;

        mostrar("suma(2, 3) =", suma(2, 3));
        mostrar("doble(4) =", doble(4));
        mostrar(saludar("Marta"));
        mostrar(saludar());
    </script>
