<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex · Mi equipo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Pokédex</h1>
    <p>Busca Pokémon y forma tu equipo de 6</p>
  </header>

  <main>
    <section class="panel">
      <h2>Buscar</h2>
      <form id="form-buscar">
        <input type="text" id="nombre" placeholder="Nombre o número (pikachu, 25...)" autocomplete="off">
        <button type="submit">Buscar</button>
      </form>
      <p id="estado"></p>
      <div id="resultado"></div>
    </section>

    <section class="panel">
      <h2>Mi equipo (<span id="contador">0</span>/6)</h2>
      <div id="equipo"></div>
      <button id="btn-vaciar" class="secundario">Vaciar equipo</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
