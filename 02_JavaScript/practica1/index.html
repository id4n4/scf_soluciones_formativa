<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetería · DOM</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 id="titulo">Cafetería</h1>
        <p class="subtitulo">Carta del día</p>
    </header>

    <main>
        <div class="botones">
            <button id="btn-ofertas">Marcar ofertas</button>
            <button id="btn-quitar">Quitar el último</button>
        </div>

        <!-- Contenedor VACÍO: las tarjetas las crea JavaScript -->
        <section id="carta" class="carta"></section>

        <p id="contador"></p>
    </main>

    <!-- El script va al final del body: así el HTML ya existe cuando se ejecuta -->
    <script src="script.js"></script>
</body>
</html>
